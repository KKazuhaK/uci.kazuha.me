# Check and build every push. Targets live in deploy/targets.json:
#   kind "branch" -> on main, each build is force-pushed to its branch; a server
#                    pulls it with ./update_site.sh (ICS: `deploy`; the `uci-ics-deploy`
#                    job runs it over SSH, and it can still be run by hand)
#   kind "cloudflare" -> on main, the `cloudflare` jobs build it and push it to its
#                    branch (cf-deploy); Cloudflare Workers Builds deploys that branch
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs third-party code (npm ci, astro): read-only token. The `publish` job pushes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: note "last edited" dates come from git log.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Type and content check
        run: npx astro check
      - name: Renderer matches the legacy md-viewer on every note
        run: npx tsx scripts/migrate/parity.ts
      # Every "branch" target in deploy/targets.json (the ICS server: `deploy`).
      # Building is also where viz configs and note links are validated.
      - name: Build each server target
        env:
          TZ: America/Los_Angeles
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh build "$t" "out/$t"
          done

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: server-targets
          path: out
          include-hidden-files: true
          retention-days: 1

  # Pushes each server target's build to its branch (ICS: `deploy`). Kept apart from
  # `build` so that npm code never runs in a job holding a write token: that token
  # decides what every server publishes. Installs and runs nothing from npm.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: server-targets
          path: ${{ runner.temp }}/out

      - name: Publish each server target to its branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # A failure inside $(…) would not stop the loop, so list first and require targets.
          targets="$(scripts/build-targets.sh list branch)"
          [ -n "$targets" ] || { echo "no branch targets in deploy/targets.json"; exit 1; }
          for t in $targets; do
            scripts/build-targets.sh push "$t" "$RUNNER_TEMP/out/$t"
          done

  # ics.uci.edu: once `publish` has pushed the `deploy` branch, log in to openlab with
  # a key whose authorized_keys line is `restrict,command="…/update_site.sh --ci"`: no
  # shell or forwarding, only that script. It pulls ~/site and, only if that leaves a
  # clean checkout of a main commit whose `build` and `publish` jobs passed, runs that
  # commit's scripts to publish its build (see update_site.sh). The runner itself
  # checks out nothing. The key is in the `ics` environment (main only). Turn it off
  # with the repo variable ICS_AUTO_DEPLOY=false.
  uci-ics-deploy:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ICS_AUTO_DEPLOY != 'false'
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: ics
      url: https://ics.uci.edu/~kazuhak/
    # One at a time; a newer push waits rather than cancelling a sync half-way.
    concurrency:
      group: uci-ics-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Run update_site.sh on openlab.ics.uci.edu
        env:
          SSH_KEY: ${{ secrets.ICS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ICS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ics
          chmod 600 ~/.ssh/ics
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server ignores the command sent; the forced command runs update_site.sh.
          # openlab hands each login to one of several nodes, and one that is unwell
          # times out or refuses the key: retry a couple of times, a minute apart (few
          # connections: openlab blocks an address that opens many). Only ssh's own
          # failures (exit 255) are retried, never a failure reported by update_site.sh.
          for attempt in 1 2 3; do
            rc=0
            ssh -T -i ~/.ssh/ics -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 \
              kazuhak@openlab.ics.uci.edu || rc=$?
            [ "$rc" -ne 255 ] && exit "$rc"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::could not reach openlab.ics.uci.edu (attempt $attempt of 3); retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::could not reach openlab.ics.uci.edu after 3 attempts; run ~/update_site.sh there by hand"
          exit 255

  # uci.kazuha.me (`cloudflare` target): build here, push the result to its branch
  # (cf-deploy); Cloudflare Workers Builds watches that branch and only runs
  # `wrangler deploy`. Runs only after `build` passed and never touches any
  # server branch, so the servers are unaffected either way.
  cloudflare:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Runs third-party code (npm ci, astro build): read-only token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - name: Build the `cloudflare` target from deploy/targets.json
        run: scripts/build-targets.sh build cloudflare out/cloudflare
        env:
          TZ: America/Los_Angeles

      # Deployment-local config (read by bento.js), from the repo variable
      # PAGES_SITE_LOCAL_JSON; skipped when the variable is unset.
      - name: Write assets/config/site.local.json
        if: vars.PAGES_SITE_LOCAL_JSON != ''
        env:
          JSON: ${{ vars.PAGES_SITE_LOCAL_JSON }}
        run: node -e 'JSON.parse(process.env.JSON); require("fs").writeFileSync("out/cloudflare/assets/config/site.local.json", process.env.JSON)'

      - name: Add wrangler.jsonc, _headers and .assetsignore
        run: scripts/build-targets.sh wrap cloudflare out/cloudflare

      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare
          path: out/cloudflare
          include-hidden-files: true
          retention-days: 1

  # Writes to the repo (cf-deploy only); like `publish`, installs and runs nothing from npm.
  cloudflare-publish:
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cloudflare-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cloudflare
          path: ${{ runner.temp }}/cloudflare

      - name: Push the build to its branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: scripts/build-targets.sh push cloudflare "$RUNNER_TEMP/cloudflare"
